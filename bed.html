<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>橘仔的床 · 第一版</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#12161d;}
  canvas{display:block;}
  #hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:rgba(255,255,255,.42);
        font:13px/1.6 -apple-system,"PingFang SC",sans-serif;pointer-events:none;letter-spacing:.05em;}
  #tag{position:fixed;top:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);
       font:14px/1.6 -apple-system,"PingFang SC",sans-serif;pointer-events:none;letter-spacing:.08em;}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="tag">床 · 第一版</div>
<div id="hint">拖动转一圈 · 两指缩放</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- 天色：按此刻真实时间 ---------- */
const h = new Date().getHours();
const P = {
  night: {sky:0x0d1220, floor:0x241f1b, amb:0x6f86c0, key:0x9db3ff, warm:0xffc98a, ai:0.30, ki:0.45, wi:0.9},
  dawn:  {sky:0xbfa6a0, floor:0x4a3f36, amb:0xffd0b0, key:0xffb27a, warm:0xffd9b0, ai:0.55, ki:1.1, wi:0.6},
  day:   {sky:0x9dc2dd, floor:0x6f6459, amb:0xdce9f5, key:0xfff6e8, warm:0xfff0d0, ai:0.75, ki:1.6, wi:0.4},
  dusk:  {sky:0x6a4a52, floor:0x453a32, amb:0xffb898, key:0xff9a58, warm:0xffbe86, ai:0.50, ki:1.2, wi:0.8}
};
let p;
if (h >= 22 || h < 5) p = P.night;
else if (h < 8)  p = P.dawn;
else if (h < 17) p = P.day;
else             p = P.dusk;

/* ---------- 基础 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(p.sky);
scene.fog = new THREE.Fog(p.sky, 6, 16);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.6, 2.1, 3.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ---------- 光 ---------- */
const amb = new THREE.AmbientLight(p.amb, p.ai);
scene.add(amb);

const key = new THREE.DirectionalLight(p.key, p.ki);
key.position.set(3.2, 5.5, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0008;
key.shadow.radius = 3;
scene.add(key);

// 床头一盏小暖灯
const lamp = new THREE.PointLight(p.warm, p.wi, 6, 2);
lamp.position.set(-1.15, 0.95, -0.75);
lamp.castShadow = true;
scene.add(lamp);

/* ---------- 地面 ---------- */
const floorGeo = new THREE.CircleGeometry(4.2, 64);
const floorMat = new THREE.MeshStandardMaterial({color:p.floor, roughness:0.95, metalness:0.0});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// 地面上一圈淡淡的质感纹路
const ringGeo = new THREE.RingGeometry(1.9, 4.15, 64);
const ringMat = new THREE.MeshBasicMaterial({color:p.floor, transparent:true, opacity:0.35, side:THREE.DoubleSide});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI/2;
ring.position.y = 0.002;
scene.add(ring);

/* ---------- 床 ---------- */
const bed = new THREE.Group();

// 床架（木头）
const frameMat = new THREE.MeshStandardMaterial({color:0x7a5a3e, roughness:0.75, metalness:0.05});
const frame = new THREE.Mesh(new THREE.BoxGeometry(1.46, 0.16, 2.06), frameMat);
frame.position.y = 0.30;
frame.castShadow = true; frame.receiveShadow = true;
bed.add(frame);

// 四条腿
const legGeo = new THREE.BoxGeometry(0.09, 0.30, 0.09);
[[-0.62,0.85],[0.62,0.85],[-0.62,-0.85],[0.62,-0.85]].forEach(([x,z])=>{
  const leg = new THREE.Mesh(legGeo, frameMat);
  leg.position.set(x, 0.15, z);
  leg.castShadow = true;
  bed.add(leg);
});

// ★ 共用的塌陷曲线：床垫和床单都用这一套，才会贴合
const MW = 1.40, MD = 2.00, MSAG = 0.075;
function sagAt(nx, nz){                 // nx,nz 已归一化到床垫尺寸
  const d2 = nx*nx*0.85 + nz*nz*0.62;
  const edge = Math.min(1, Math.max(0, (1-Math.max(Math.abs(nx),Math.abs(nz)))*4));
  return Math.max(0, 1-d2) * MSAG * edge;
}
function outward(nx, nz){               // 边缘被压出来的鼓包
  const d2 = nx*nx*0.85 + nz*nz*0.62;
  return Math.max(0, 1-d2) * 0.075;
}

// ★ 床垫：顶面中间往下塌，做出"软"的感觉
function makeMattress(){
  const W=1.40, H=0.26, D=2.00;
  const geo = new RoundedBoxGeometry(W, H, D, 6, 0.022);   // ★ 圆角盒子
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    if (v.y > H*0.30){                       // 只动上面那半
      const nx = v.x/(W/2), nz = v.z/(D/2);
      const sag = sagAt(nx, nz);
      v.y -= sag;
      v.x *= 1 + outward(nx,nz)*0.35;         // 旁边鼓一点出来
      v.z *= 1 + outward(nx,nz)*0.18;
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}
const mattressMat = new THREE.MeshStandardMaterial({color:0xf2ece2, roughness:1.0, metalness:0.0});
const mattress = new THREE.Mesh(makeMattress(), mattressMat);
mattress.position.y = 0.51;
mattress.castShadow = true; mattress.receiveShadow = true;
bed.add(mattress);

// ★ 床单：矮罩子 —— 只盖住顶面 + 垂一圈，露出床垫的边
//   尺寸比床垫大一圈，z 方向短一点躲开床头板，底部落在床板之上（0.40）
function makeSheet(){
  const W = MW + 0.04, D = MD + 0.02;      // 宽 1.44 / 长 2.02（左右各垂 2cm，前后各 1cm）
  const TOP = 0.640 + 0.020;                // 顶面 = 床垫最高点 + 2cm
  const BOT = 0.400;                        // 底面 = 床板顶面之上，不扎进去
  const H = TOP - BOT;                      // 0.26
  const geo = new RoundedBoxGeometry(W, H, D, 12, 0.030);   // ★ 边做圆（比床垫更圆：布比海绵软）
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const halfTop = H/2;
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    if (v.y > halfTop - 0.012){
      // ★ 用床垫那套曲线算（把罩子坐标归一化到床垫尺寸），所以贴得上
      const nx = v.x/(MW/2), nz = v.z/(MD/2);
      v.y -= sagAt(nx, nz);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return {geo, H, TOP, BOT};
}
const sheetMat = new THREE.MeshStandardMaterial({color:0xe6dfd5, roughness:1.0, metalness:0.0, side:THREE.DoubleSide});
{
  const r = makeSheet();
  const sheet = new THREE.Mesh(r.geo, sheetMat);
  sheet.position.y = (r.TOP + r.BOT) / 2;
  sheet.castShadow = true; sheet.receiveShadow = true;
  bed.add(sheet);
}

// 被子（盖住下半身那半张）
function makeQuilt(){
  const W=1.44, H=0.13, D=1.18;
  const geo = new RoundedBoxGeometry(W, H, D, 6, 0.014);   // ★ 圆角
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    if (v.y > H*0.3){
      const nx=v.x/(W/2), nz=v.z/(D/2);
      const d2 = nx*nx*0.8 + nz*nz*0.5;
      v.y -= Math.max(0,1-d2)*0.055;
      // 一点起伏，像有褶皱
      v.y += Math.sin(nx*5.0)*0.008 + Math.sin(nz*4.0)*0.006;
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}
const quiltMat = new THREE.MeshStandardMaterial({color:0xd6c3b4, roughness:1.0, metalness:0.0});
const quilt = new THREE.Mesh(makeQuilt(), quiltMat);
quilt.position.set(0, 0.695, 0.44);
quilt.castShadow = true; quilt.receiveShadow = true;
bed.add(quilt);

// 枕头（压下去的圆润方块）
function makePillow(){
  const geo = new RoundedBoxGeometry(0.62, 0.13, 0.36, 5, 0.028);   // ★ 圆角
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    if (v.y > 0.02){
      const nx=v.x/0.31, nz=v.z/0.18;
      const d2 = nx*nx*0.9 + nz*nz*0.9;
      v.y -= Math.max(0,1-d2)*0.045;
    }
    // 四边往里收一点，像揉过的枕头
    const bx = Math.abs(v.x)/0.31, bz = Math.abs(v.z)/0.18;
    v.x *= 1 - Math.max(0, bz-0.7)*0.25;
    v.z *= 1 - Math.max(0, bx-0.7)*0.25;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}
const pillowMat = new THREE.MeshStandardMaterial({color:0xfbf7f0, roughness:1.0});
const p1 = new THREE.Mesh(makePillow(), pillowMat);
p1.position.set(-0.32, 0.715, -0.68);
p1.rotation.y = 0.10; p1.rotation.z = 0.03;
p1.castShadow = true; p1.receiveShadow = true;
bed.add(p1);

const p2 = new THREE.Mesh(makePillow(), pillowMat);
p2.position.set(0.34, 0.715, -0.64);
p2.rotation.y = -0.12; p2.rotation.z = -0.02;
p2.castShadow = true; p2.receiveShadow = true;
bed.add(p2);

// 床头板
const headMat = new THREE.MeshStandardMaterial({color:0x6b4e36, roughness:0.7});
const headboard = new THREE.Mesh(new THREE.BoxGeometry(1.50, 0.72, 0.08), headMat);
headboard.position.set(0, 0.62, -1.06);
headboard.castShadow = true; headboard.receiveShadow = true;
bed.add(headboard);

bed.position.y = 0;
scene.add(bed);

/* ---------- 毛绒：先放三个占位（颜色块，明天做真的） ---------- */
function fluff(color, r, x, y, z, sx=1, sy=1, sz=1){
  const g = new THREE.SphereGeometry(r, 20, 16);
  const m = new THREE.MeshStandardMaterial({color, roughness:1.0});
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x,y,z);
  mesh.scale.set(sx,sy,sz);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
// 小陆（米色，靠在枕边）
bed.add(fluff(0xe8d9c4, 0.13, -0.28, 0.835, -0.42, 1.0, 1.15, 0.9));
// 小鲸鱼（蓝，躺被子上）
bed.add(fluff(0x7fa7c9, 0.11, 0.38, 0.815, 0.42, 1.5, 0.85, 0.9));
// 蟑螂（褐色毛毛虫，被角上）
bed.add(fluff(0x8a6a4a, 0.075, -0.42, 0.815, 0.72, 2.0, 0.9, 0.9));

/* ---------- 标尺：网格 / 尺寸线 / 人形对照 ---------- */
const ruler = new THREE.Group();
ruler.visible = false;          // 默认关着，点右下角按钮再开
scene.add(ruler);

// 地面网格：4m × 4m，一格 0.5m
const grid = new THREE.GridHelper(4, 8, 0x9fd0ff, 0x6f8fa8);
grid.position.y = 0.004;
grid.material.transparent = true;
grid.material.opacity = 0.5;
ruler.add(grid);

// 文字贴图：canvas 画字 → Sprite（不跟光照走）
function makeLabel(text, size = 0.15) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#bfe3ff';
  ctx.font = 'bold 52px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false
  }));
  sp.scale.set(size * 2, size, 1);
  return sp;
}

// 尺寸线：一条线段 + 两端短竖线 + 中间的字
function makeDim(from, to, text, labelLift = 0.13) {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: 0x7fc8ff, transparent: true, opacity: 0.85 });

  g.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(...from), new THREE.Vector3(...to)
    ]), mat));

  [from, to].forEach(p => {
    g.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(p[0], p[1] - 0.05, p[2]),
        new THREE.Vector3(p[0], p[1] + 0.05, p[2])
      ]), mat));
  });

  const lab = makeLabel(text);
  lab.position.set(
    (from[0] + to[0]) / 2,
    (from[1] + to[1]) / 2 + labelLift,
    (from[2] + to[2]) / 2
  );
  g.add(lab);
  return g;
}

// 床宽 1.46（x 方向，画在床尾那头）
ruler.add(makeDim([-0.73, 0.42, 1.16], [0.73, 0.42, 1.16], '1.46'));
// 床长 2.06（z 方向，画在床的右侧）
ruler.add(makeDim([0.88, 0.42, -1.03], [0.88, 0.42, 1.03], '2.06'));

/* ★ 人形对照：1.68 m（宝的身高），半透明躺在床垫上 */
const personMat = new THREE.MeshStandardMaterial({
  color: 0x9fd0ff, roughness: 0.85, metalness: 0.0,
  transparent: true, opacity: 0.42
});
const person = new THREE.Group();

// 身体：胶囊，沿 z 轴躺下。总长 = 1.40 + 0.14×2 = 1.68
const bodyMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 1.40, 6, 20), personMat);
bodyMesh.rotation.x = Math.PI / 2;
person.add(bodyMesh);

// 头：球，放在 -z 一端，外缘正好抵到 -0.84
const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 18), personMat);
headMesh.position.z = -0.725;
person.add(headMesh);

person.position.set(0, 0.66, 0);   // 躺在床垫表面
ruler.add(person);

// 人体长度标注（放在人上方，避开床长那条线）
ruler.add(makeDim([-0.40, 0.98, -0.84], [-0.40, 0.98, 0.84], '1.68', 0.08));

/* 开关按钮 */
const rulerBtn = document.createElement('button');
rulerBtn.textContent = '标尺';
rulerBtn.style.cssText =
  'position:fixed;right:16px;bottom:52px;padding:8px 16px;border-radius:20px;' +
  'border:1px solid rgba(160,210,255,.45);background:rgba(18,26,38,.72);' +
  'color:#bfe3ff;font:13px/1 -apple-system,"PingFang SC",sans-serif;' +
  'letter-spacing:.08em;opacity:.6;';
rulerBtn.onclick = () => {
  ruler.visible = !ruler.visible;
  rulerBtn.style.opacity = ruler.visible ? '1' : '.6';
};
document.body.appendChild(rulerBtn);

/* ---------- 渲染 ---------- */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
