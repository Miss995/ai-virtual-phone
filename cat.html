<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猫画的猫</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#2a1a14 0%,#3a241a 100%);
  }
  .frame{
    width:min(100vw,100vh);
    height:min(100vw,100vh);
    position:relative;
  }
  svg{display:block;width:100%;height:100%}
  .cap{
    position:fixed;left:0;right:0;bottom:18px;text-align:center;
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:rgba(255,255,255,.34);letter-spacing:.14em;pointer-events:none;
  }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f7c98a"/>
      <stop offset="46%" stop-color="#eda869"/>
      <stop offset="62%" stop-color="#dd8455"/>
      <stop offset="63%" stop-color="#a8533f"/>
      <stop offset="100%" stop-color="#7b3a30"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9c2" stop-opacity=".95"/>
      <stop offset="60%" stop-color="#ffcf8e" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffcf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="catBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a35c"/>
      <stop offset="100%" stop-color="#d97f3c"/>
    </linearGradient>
  </defs>

  <!-- 黄昏的天 -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- 太阳周围的晕 -->
  <circle cx="200" cy="252" r="120" fill="url(#sunGlow)"/>
  <!-- 夕阳（半沉进海平线） -->
  <circle cx="200" cy="252" r="34" fill="#ffe6b8" opacity=".92"/>
  <!-- 海平线上的碎光 -->
  <rect x="150" y="252" width="100" height="3" fill="#ffd9a3" opacity=".55"/>
  <ellipse cx="200" cy="256" rx="76" ry="5" fill="#ffd9a3" opacity=".28"/>

  <!-- 沙滩 -->
  <path d="M0 330 Q 200 308 400 330 L400 400 L0 400 Z" fill="#c98f5d"/>
  <path d="M0 348 Q 200 330 400 348 L400 400 L0 400 Z" fill="#b87f4f"/>

  <!-- 猫的影子 -->
  <ellipse cx="204" cy="352" rx="86" ry="13" fill="#8d5a34" opacity=".38"/>

  <!-- 尾巴（先画，压在身上面） -->
  <path d="M262 316 C 320 312 344 268 322 230"
        stroke="url(#catBody)" stroke-width="27" fill="none"
        stroke-linecap="round"/>
  <path d="M316 240 C 322 252 328 258 334 260"
        stroke="#b86b32" stroke-width="7" fill="none"
        stroke-linecap="round" opacity=".55"/>

  <!-- 身体 -->
  <path d="M138 236 C 116 296 116 340 152 348 L248 348 C 284 340 284 296 262 236 Z"
        fill="url(#catBody)"/>
  <!-- 肚皮 -->
  <ellipse cx="200" cy="312" rx="43" ry="47" fill="#fdf0e0" opacity=".95"/>
  <!-- 前爪 -->
  <ellipse cx="170" cy="348" rx="21" ry="11.5" fill="#fdf0e0"/>
  <ellipse cx="230" cy="348" rx="21" ry="11.5" fill="#fdf0e0"/>
  <path d="M162 344 L162 352 M170 344 L170 353 M178 344 L178 352"
        stroke="#e9d3bd" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M222 344 L222 352 M230 344 L230 353 M238 344 L238 352"
        stroke="#e9d3bd" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <path d="M144 132 L131 66 L188 104 Z" fill="url(#catBody)"/>
  <path d="M256 132 L269 66 L212 104 Z" fill="url(#catBody)"/>
  <path d="M152 122 L146 86 L175 108 Z" fill="#f0a89a" opacity=".9"/>
  <path d="M248 122 L254 86 L225 108 Z" fill="#f0a89a" opacity=".9"/>

  <!-- 头（先画脸颊再画主圆，让轮廓更圆） -->
  <ellipse cx="152" cy="196" rx="30" ry="26" fill="url(#catBody)"/>
  <ellipse cx="248" cy="196" rx="30" ry="26" fill="url(#catBody)"/>
  <ellipse cx="200" cy="182" rx="74" ry="66" fill="url(#catBody)"/>

  <!-- 额头 M 纹 -->
  <path d="M182 132 L182 156" stroke="#c07334" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M200 126 L200 152" stroke="#c07334" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M218 132 L218 156" stroke="#c07334" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- 眼 -->
  <ellipse cx="172" cy="186" rx="14.5" ry="17.5" fill="#332a24"/>
  <ellipse cx="228" cy="186" rx="14.5" ry="17.5" fill="#332a24"/>
  <circle cx="177.5" cy="180" r="5" fill="#fff" opacity=".95"/>
  <circle cx="233.5" cy="180" r="5" fill="#fff" opacity=".95"/>
  <circle cx="168" cy="193" r="2.2" fill="#fff" opacity=".55"/>
  <circle cx="224" cy="193" r="2.2" fill="#fff" opacity=".55"/>

  <!-- 鼻 -->
  <path d="M193 207 L207 207 L200 215 Z" fill="#d4715a"/>
  <!-- 嘴 -->
  <path d="M200 215 Q 200 226 189 228" stroke="#b86b32" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M200 215 Q 200 226 211 228" stroke="#b86b32" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- 胡须 -->
  <g stroke="#fff8ef" stroke-width="2.2" stroke-linecap="round" opacity=".78">
    <path d="M150 202 L104 192"/>
    <path d="M148 210 L100 210"/>
    <path d="M150 218 L106 228"/>
    <path d="M250 202 L296 192"/>
    <path d="M252 210 L300 210"/>
    <path d="M250 218 L294 228"/>
  </g>

  <!-- 腮红 -->
  <ellipse cx="145" cy="208" rx="14" ry="8" fill="#f08b73" opacity=".28"/>
  <ellipse cx="255" cy="208" rx="14" ry="8" fill="#f08b73" opacity=".28"/>
</svg>
</div>
<div class="cap">猫画的</div>
</body>
</html>
