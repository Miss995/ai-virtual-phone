<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>表情包库 v1</title>
<style>
:root{--bg:#17141a;--card:#221e26;--ink:#e9e3ee;--dim:#8b8398;--accent:#ffb26b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 12px 60px}
h1{font-size:15px;font-weight:600;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{position:relative;background:var(--card);border-radius:10px;overflow:hidden;aspect-ratio:1}
.cell img{width:100%;height:100%;object-fit:contain;display:block}
.cell .no{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.62);color:var(--accent);font-size:10px;padding:1px 5px;border-radius:6px;font-variant-numeric:tabular-nums}
.cell.picked{outline:2px solid var(--accent);outline-offset:-2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0f0d12ee;border-top:1px solid #2b2632;padding:10px 14px;font-size:12px;color:var(--dim)}
.bar b{color:var(--accent)}
</style></head><body>
<h1>表情包库 · v1</h1>
<div class="sub">点一下选中，底部会记编号。挑完把编号发我。</div>
