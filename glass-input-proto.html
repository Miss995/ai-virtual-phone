<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃 · 输入框</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#141110}
  body{font-family:-apple-system,system-ui,"PingFang SC",sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* 模拟聊天内容（只是给玻璃一点上下文，不参与计算） */
  .chat{position:fixed;inset:0;padding:14px 14px 190px;display:flex;flex-direction:column;gap:10px;
        overflow:auto;pointer-events:none}
  .msg{max-width:78%;padding:10px 13px;border-radius:18px;font-size:13.5px;line-height:1.6;color:#f0e8df}
  .ai{background:rgba(255,255,255,.07);align-self:flex-start;border:1px solid rgba(255,255,255,.08)}
  .me{background:rgba(240,160,90,.16);align-self:flex-end;border:1px solid rgba(240,160,90,.22);color:#ffe6d0}

  /* 玻璃占位：只用来量位置，本身不画 */
  #dock{position:fixed;left:12px;right:12px;bottom:16px;height:56px;border-radius:22px;pointer-events:none}

  /* 参数面板 */
  .panel{position:fixed;left:12px;right:12px;bottom:84px;background:rgba(20,17,16,.82);
         border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px 14px;
         display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(10px);z-index:9}
  .row{display:flex;align-items:center;gap:10px;font-size:11px;color:#9a9089;letter-spacing:.05em}
  .row label{width:52px;flex:none}
  .row input[type=range]{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;
         background:rgba(255,255,255,.16);outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
         border-radius:50%;background:#f0a05a;box-shadow:0 0 0 3px rgba(240,160,90,.18)}
  .row b{width:34px;text-align:right;font-weight:400;color:#c9bdb3;font-variant-numeric:tabular-nums}
  .hd{font-size:10.5px;color:#6f665f;letter-spacing:.14em}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="chat">
  <div class="msg ai">今天风大，窗台那边有点凉。</div>
  <div class="msg me">我把窗户关了</div>
  <div class="msg ai">关得好。灯还亮着。</div>
  <div class="msg me">嗯，看得见</div>
  <div class="msg ai">那就行。</div>
</div>

<div id="dock"></div>

<div class="panel">
  <div class="hd">液 态 玻 璃 · 参 数</div>
  <div class="row"><label>折射</label><input id="r1" type="range" min="0" max="3" step="0.05" value="1"><b id="v1">1.0</b></div>
  <div class="row"><label>模糊</label><input id="r2" type="range" min="0" max="0.03" step="0.001" value="0.012"><b id="v2">12</b></div>
  <div class="row"><label>边缘</label><input id="r3" type="range" min="0" max="1.2" step="0.02" value="0.5"><b id="v3">0.50</b></div>
</div>

<script>
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'});
if(!gl){
  document.body.innerHTML = '<p style="color:#fff;padding:20px;font-size:14px">这个浏览器没开 WebGL，看不了这个预览。</p>';
  throw new Error('no webgl');
}

const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;

const fs = `
precision highp float;
uniform vec2  uRes;
uniform vec4  uRect;     // x,y,w,h（物理像素，左上原点）
uniform float uRadius;
uniform float uRefract;
uniform float uBlur;
uniform float uEdge;

vec3 bg(vec2 uv){
  vec3 c = mix(vec3(0.16,0.13,0.115), vec3(0.34,0.27,0.21), uv.y);
  c += vec3(1.00,0.66,0.38) * 0.45 * smoothstep(0.90,0.0,length(uv-vec2(0.18,0.80)));
  c += vec3(0.38,0.78,1.00) * 0.34 * smoothstep(0.85,0.0,length(uv-vec2(0.86,0.64)));
  c += vec3(1.00,0.46,0.62) * 0.30 * smoothstep(0.80,0.0,length(uv-vec2(0.54,0.20)));
  c += vec3(0.55,1.00,0.50) * 0.22 * smoothstep(0.72,0.0,length(uv-vec2(0.06,0.14)));
  float band = sin((uv.x * 0.85 + uv.y) * 7.0) * 0.5 + 0.5;
  c += vec3(0.075,0.060,0.045) * band;
  float s2 = sin((uv.x + uv.y * 0.55) * 260.0);
  c += vec3(0.026) * smoothstep(0.55,1.0,s2);
  return c;
}

vec3 blurBg(vec2 uv, float r){
  vec3 s = vec3(0.0);
  for(int i=0;i<10;i++){
    float a  = float(i) * 0.6283185;
    float rr = r * (0.45 + 0.55 * mod(float(i),3.0) / 2.0);
    s += bg(uv + vec2(cos(a), sin(a)) * rr);
  }
  return s / 10.0;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 col = blurBg(uv, uBlur * 0.7);

  vec2 cp = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);

  vec2 half2   = uRect.zw * 0.5;
  vec2 center  = uRect.xy + half2;
  vec2 pp = abs(cp - center) - half2 + vec2(uRadius);
  float sd = length(max(pp, 0.0)) + min(max(pp.x, pp.y), 0.0) - uRadius;

  if(sd < 1.0){
    vec2 q = (cp - uRect.xy) / uRect.zw;
    vec2 d2 = abs(q - 0.5) * 2.0;
    float edge = smoothstep(0.62, 1.0, max(d2.x, d2.y));

    vec2 dir = normalize(q - 0.5 + vec2(1e-5));
    vec2 shift = dir * edge * edge * uRefract * 0.035;

    vec3 g = blurBg(uv + shift, uBlur);
    g = mix(g, vec3(1.0), 0.045);
    g += vec3(edge * uEdge * 0.55);
    float vert = (q.y - 0.5) * -2.0;
    g += vec3(0.055 * vert);

    col = mix(col, g, smoothstep(0.9, -0.6, sd));
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

function mkShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error('shader:', gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.error('link:', gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const U = {
  res:     gl.getUniformLocation(prog, 'uRes'),
  rect:    gl.getUniformLocation(prog, 'uRect'),
  radius:  gl.getUniformLocation(prog, 'uRadius'),
  refract: gl.getUniformLocation(prog, 'uRefract'),
  blur:    gl.getUniformLocation(prog, 'uBlur'),
  edge:    gl.getUniformLocation(prog, 'uEdge'),
};

const dock = document.getElementById('dock');
const p1 = document.getElementById('r1');
const p2 = document.getElementById('r2');
const p3 = document.getElementById('r3');

let rect = [0, 0, 100, 56];
let dpr = 1;

function draw(){
  gl.uniform2f(U.res, cvs.width, cvs.height);
  gl.uniform4f(U.rect, rect[0], rect[1], rect[2], rect[3]);
  gl.uniform1f(U.radius, 22 * dpr);
  gl.uniform1f(U.refract, parseFloat(p1.value));
  gl.uniform1f(U.blur, parseFloat(p2.value));
  gl.uniform1f(U.edge, parseFloat(p3.value));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  document.getElementById('v1').textContent = parseFloat(p1.value).toFixed(2);
  document.getElementById('v2').textContent = Math.round(parseFloat(p2.value) * 1000);
  document.getElementById('v3').textContent = parseFloat(p3.value).toFixed(2);
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width  = Math.floor(innerWidth  * dpr);
  cvs.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cvs.width, cvs.height);
  const r = dock.getBoundingClientRect();
  rect = [r.left * dpr, r.top * dpr, r.width * dpr, r.height * dpr];
  draw();
}

p1.oninput = p2.oninput = p3.oninput = draw;
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 180));
setTimeout(resize, 60);
</script>
</body>
</html>
