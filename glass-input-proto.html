<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>液态玻璃 · 输入框</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1512;
            font-family:-apple-system,system-ui,"PingFang SC",sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 玻璃占位：只用来量位置 */
  #dock{position:fixed;left:12px;right:12px;bottom:16px;height:56px;border-radius:22px;pointer-events:none}

  .panel{position:fixed;left:12px;right:12px;bottom:84px;background:rgba(20,17,16,.86);
         border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:11px 14px;
         display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(12px);z-index:9}
  .row{display:flex;align-items:center;gap:10px;font-size:11px;color:#9a9089;letter-spacing:.05em}
  .row label{width:52px;flex:none}
  .row input[type=range]{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;
         background:rgba(255,255,255,.16);outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
         border-radius:50%;background:#f0a05a;box-shadow:0 0 0 3px rgba(240,160,90,.18)}
  .row b{width:34px;text-align:right;font-weight:400;color:#c9bdb3;font-variant-numeric:tabular-nums}
  .hd{font-size:10.5px;color:#6f665f;letter-spacing:.14em}
  .hint{position:fixed;left:0;right:0;top:12px;text-align:center;font-size:11px;
        color:#9a8f86;letter-spacing:.1em;pointer-events:none;z-index:8}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="dock"></div>
<div class="hint">↑ 划一下，让字从玻璃底下过</div>

<div class="panel">
  <div class="hd">液 态 玻 璃 · 参 数</div>
  <div class="row"><label>厚度</label><input id="r0" type="range" min="0" max="1.5" step="0.02" value="0.4"><b id="v0">0.40</b></div>
  <div class="row"><label>折射</label><input id="r1" type="range" min="0" max="3" step="0.05" value="1"><b id="v1">1.00</b></div>
  <div class="row"><label>模糊</label><input id="r2" type="range" min="0" max="0.03" step="0.001" value="0.010"><b id="v2">10</b></div>
  <div class="row"><label>边缘</label><input id="r3" type="range" min="0" max="1.2" step="0.02" value="0.5"><b id="v3">0.50</b></div>
  <div class="row"><label>高光</label><input id="r4" type="range" min="0" max="2.5" step="0.05" value="1"><b id="v4">1.00</b></div>
  <div class="row"><label>凸度</label><input id="r5" type="range" min="0" max="1.5" step="0.05" value="0.6"><b id="v5">0.60</b></div>
</div>

<script>
(function(){
'use strict';

const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'});
if(!gl){ document.body.innerHTML = '<p style="color:#fff;padding:24px;font-size:14px">这个浏览器没开 WebGL，看不了。</p>'; return; }

/* ===== 离屏画布：背景 + 消息，全部画在这里 ===== */
const off  = document.createElement('canvas');
const octx = off.getContext('2d');
let W = 0, H = 0;

const MSGS = [
  { me:0, t:'今天风大，窗台那边有点凉。' },
  { me:1, t:'我把窗户关了' },
  { me:0, t:'关得好。灯还亮着。' },
  { me:1, t:'嗯，看得见' },
  { me:0, t:'那就行。手还疼吗？' },
  { me:1, t:'不疼了' },
  { me:0, t:'那就好。刚才那块玻璃猫又调了一版，边缘那圈亮线收窄了。' },
  { me:1, t:'我看看' },
  { me:0, t:'还有色散，在浅色背景上会出彩边，猫先关掉了。' },
  { me:1, t:'开回来看看嘛' },
  { me:0, t:'行，不过得先把折射调对——折射是玻璃把底下的东西推开，' +
         '推得过头就糊成一团，推得太少就只是块磨砂。' },
  { me:1, t:'那你现在这个推开多少' },
  { me:0, t:'边缘大概 12 个像素。中间不动，只有靠边一圈受力。' },
  { me:1, t:'为什么中间不动' },
  { me:0, t:'因为真玻璃是一整块，中间是平的；只有边缘那圈有弧度，' +
         '光穿过去才拐弯。中间跟着一起歪，就不像玻璃了，像水。' },
  { me:1, t:'原来如此' },
  { me:0, t:'所以厚度是靠边缘那一圈撑起来的。你现在划一下，' +
         '让这些字从底下过去，就能看见它们被推开。' },
];

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function wrapText(text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    const test = line + ch;
    if (octx.measureText(test).width > maxW && line){ out.push(line); line = ch; }
    else line = test;
  }
  if (line) out.push(line);
  return out;
}

let scrollY = 0;
let maxScroll = 0;

function drawScene(){
  const g = octx.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0,   '#241b16');
  g.addColorStop(0.55,'#3a2c22');
  g.addColorStop(1,   '#57432f');
  octx.fillStyle = g;
  octx.fillRect(0, 0, W, H);

  // 四团大光斑
  const glow = (cx, cy, r, rgb, a) => {
    const rg = octx.createRadialGradient(cx*W, cy*H, 0, cx*W, cy*H, r*Math.max(W,H));
    rg.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
    rg.addColorStop(1, 'rgba(' + rgb + ',0)');
    octx.fillStyle = rg;
    octx.fillRect(0, 0, W, H);
  };
  glow(0.18, 0.20, 0.55, '255,168,90',  0.42);
  glow(0.86, 0.36, 0.50, '96,190,255',  0.30);
  glow(0.54, 0.82, 0.52, '255,120,158', 0.26);
  glow(0.06, 0.88, 0.44, '150,255,140', 0.18);

  // 斜向细纹
  octx.save();
  octx.globalAlpha = 0.05;
  octx.strokeStyle = '#ffffff';
  octx.lineWidth = 1;
  for (let i = -H; i < W + H; i += 26){
    octx.beginPath(); octx.moveTo(i, 0); octx.lineTo(i + H * 0.55, H); octx.stroke();
  }
  octx.restore();

  // 消息
  octx.font = '14px -apple-system, "PingFang SC", system-ui, sans-serif';
  const padX = 12, padY = 11, lineH = 22, gap = 10, side = 16, maxBubbleW = W * 0.74;
  let y = 40 - scrollY;

  for (const m of MSGS){
    const lines = wrapText(m.t, maxBubbleW - padX * 2);
    let tw = 0;
    for (const l of lines) tw = Math.max(tw, octx.measureText(l).width);
    const w = tw + padX * 2;
    const h = lines.length * lineH + padY * 2 - 4;
    const x = m.me ? (W - side - w) : side;

    if (y + h > -40 && y < H + 40){
      octx.save();
      octx.shadowColor = 'rgba(0,0,0,.35)';
      octx.shadowBlur = 12;
      octx.shadowOffsetY = 3;
      roundRect(octx, x, y, w, h, 18);
      octx.fillStyle = m.me ? 'rgba(240,160,90,.26)' : 'rgba(255,255,255,.10)';
      octx.fill();
      octx.restore();

      roundRect(octx, x + 0.5, y + 0.5, w - 1, h - 1, 18);
      octx.strokeStyle = m.me ? 'rgba(255,190,140,.28)' : 'rgba(255,255,255,.13)';
      octx.lineWidth = 1;
      octx.stroke();

      octx.fillStyle = m.me ? '#ffe7d2' : '#f1e9e0';
      for (let i = 0; i < lines.length; i++){
        octx.fillText(lines[i], x + padX, y + padY + 15 + i * lineH);
      }
    }
    y += h + gap;
  }

  maxScroll = Math.max(0, y + scrollY - H + 120);
}

/* ===== WebGL ===== */
const vs = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }';

const fs = [
'precision highp float;',
'uniform vec2  uRes;',
'uniform vec4  uRect;',
'uniform float uRadius;',
'uniform float uRefract;',
'uniform float uBlur;',
'uniform float uEdge;',
'uniform float uSpec;',
'uniform float uZoom;',
'uniform float uThick;',
'uniform sampler2D uTex;',
'',
'vec3 at(vec2 uv){ return texture2D(uTex, clamp(uv, vec2(0.0), vec2(1.0))).rgb; }',
'',
'vec3 blurAt(vec2 uv, float r){',
'  vec3 s = vec3(0.0);',
'  for(int i=0;i<10;i++){',
'    float a  = float(i) * 0.6283185;',
'    float rr = r * (0.45 + 0.55 * mod(float(i),3.0) / 2.0);',
'    s += at(uv + vec2(cos(a), sin(a)) * rr);',
'  }',
'  return s / 10.0;',
'}',
'',
'void main(){',
'  vec2 uv = gl_FragCoord.xy / uRes;',
'  vec3 col = at(uv);',
'',
'  vec2 cp = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);',
'  vec2 half2  = uRect.zw * 0.5;',
'  vec2 center = uRect.xy + half2;',
'  vec2 pp = abs(cp - center) - half2 + vec2(uRadius);',
'  float sd = length(max(pp, 0.0)) + min(max(pp.x, pp.y), 0.0) - uRadius;',
'',
'  if (sd < 1.0){',
'    vec2 q = (cp - uRect.xy) / uRect.zw;',
'',
'    // 边缘权重：用圆角矩形 SDF，圆角处自然收住（不再按方形角落拉满）',
'    float band = max(uRadius * (0.10 + 0.22 * uThick), 3.0);',
'    float e0   = 1.0 - smoothstep(0.0, band, -sd);',
'    float edge = e0 * e0;',
'',
'    // 法向：直边垂直于边，圆角从圆心向外',
'    vec2 dvec   = cp - center;',
'    vec2 inner  = clamp(dvec, -half2 + vec2(uRadius), half2 - vec2(uRadius));',
'    vec2 dirCss = normalize(dvec - inner + vec2(0.0001));',
'    vec2 dir    = vec2(dirCss.x, -dirCss.y);',
'    vec2 shift  = dir * edge * e0 * uRefract * (0.002 + 0.014 * uThick);',
'',
'    vec2 elemCenter = (uRect.xy + half2) / uRes;',
'    elemCenter.y = 1.0 - elemCenter.y;',
'    vec2 src = uv + shift;',
'    float kz = 1.0 + 0.010 * uThick',
'             + uZoom * (0.010 + 0.024 * uThick) * sin(e0 * 3.14159);',
'    kz -= uZoom * (0.008 + 0.018 * uThick) * smoothstep(0.55, 1.00, e0);',
'    src = elemCenter + (src - elemCenter) * kz;',
'',
'    vec3 g = blurAt(src, uBlur);',
'    g = mix(g, vec3(1.0), 0.05);',
'    float vert = (q.y - 0.5) * -2.0;',
'    g += vec3(0.05 * vert);',
'',
'    // ===== 边缘的两件东西，2026-11-08 拆开（宝："内圈白是体现体积感的，高光是高光"）=====',
'    //   ① 内圈白 inner —— 走整圈，靠边最亮往里淡，负责"这是块有厚度的东西"',
'    //   ② 高光  glint  —— 只走左上/右下两段，中间是空的，极细，带底色',
'    // 旧版的错：面上画一个椭圆斑(spec1) + 一条 45° 直线(spec2, q.x+q.y=常数 就是条直线)，',
'    //          宝一眼看出"圆角玻璃为什么高光是直线"，就是 spec2。两个都删。',
'    // 【高光分布 · 2026-11-08 二修】宝圈着左下角说"收的超级突兀"。两个成因一起改：',
'    //   ① 旧版角度用 atan(点-中心) 算 —— 圆角那一段角度会**跳**（横长条尤其明显），',
'    //      于是光在转角处突然断掉。改用**边界法线** dirCss 算角度：法线沿边界平滑转，不跳。',
'    //   ② 高斯 σ 只有 0.55 弧度（约 31°），两段之间掉到接近 0 → 看着是"一刀切"。放到 0.92。',
'    //   另加 0.10 的底：整圈留一丝，让它淡出去而不是断掉。',
'    // ⚠️ 别写 exp(-pow(x, 2.0))：GLSL ES 里 pow 底数为负是未定义的，返回 NaN → 整块黑屏。',
'    float ang2 = atan(dirCss.y, dirCss.x);',
'    // 【2026-11-08 五修】宝："就只要左上和右下有高光，其他地方没有高光，',
'    //   不要因为高光要有粗细变化就把整个气泡都包一遍"。',
'    //   → 底噪彻底去掉（真的到 0），σ 从 53° 收到 36°（只覆盖两个角，不铺到边上），',
'    //     平滑靠下面的【宽度 sqrt 曲线】撑，不靠垫底。',
'    // 【2026-11-08 六修】宝："高光还要稍微再长一点，不要太夸张的包边，稍微有一点点勾勒"',
'    //   σ 36° → 41°：长一点，但够不到边上（到上边中点只剩 0.28，已经淡成勾）',
'    float tA = (ang2 + 2.36) / 0.72;',
'    float tB = (ang2 - 0.79) / 0.72;',
'    float gUL = exp(-tA * tA);',
'    float gLR = exp(-tB * tB);',
'    float glintMask = gUL * 1.00 + gLR * 0.55;   // 无底噪 ✅ 中间天然到 0',
'',
'    // 离边界往里多少像素（sd 在内部为负）',
'    float dpr = max(uRadius / 22.0, 1.0);',
'    float dist = -sd;',
'',
'    // 【高光线 · 2026-11-08 改硬】宝："太厚了，而且太糊了，就要那种很亮、很细、很实的那种"',
'    // 旧版是高斯（exp(-t*t)），尾巴拖很长 → 看着是一团晕，不实。',
'    // 现在换成**平顶 + 1px 收边**的矩形截面：线身亮度恒定，只有边缘半像素做抗锯齿。',
'    // 几何：线中心离边界 1.1 CSS px，整条宽 1.5 CSS px（约 4 个设备像素）——细，但看得见。',
'    float wC = 1.1 * dpr;                       // 中心离边界多远',
'    float hw = 0.80 * dpr;                      // 半宽（最亮处的宽度）',
'    float dLine = abs(dist - wC);',
'    // 【渐渐变细 · 2026-11-08 三修】宝："颜色就直接跳下去了，能不能给它用渐渐变细那种"',
'    // 这一句是钥匙：之前只让**亮度**跟着 glintMask 掉，线的**宽度是死的** → 看着像被一刀切断。',
'    // 现在让**宽度**跟着 mask 收：亮处粗、暗处细，末端收成一根毫毛，自然就没了。',
'    // 再叠一点点亮度变化（只做辅助，不做主力），两层一起过渡，怎么都断不出来。',
'    // 【跳动的真因 · 2026-11-08】圆角的弧只有 22px，法线却要在这 22px 里转过 90°，',
'    // 宽度若跟 mask 线性绑定，就会在很短的一段弧上收掉一大截 → 眼睛读成"卡了一下、颜色直接掉"。',
'    // 所以：① 保底 30%（收得缓）② 亮度下限压到 0.15（暗处真的暗）',
'    // 宽度用 sqrt：mask=1 → 满宽；mask=0.25 → 还有一半宽；mask=0 → 真的 0。',
'    // 前期收得慢（不会在中段突然细一刀），末端一路细到看不见（不是断，是收成毫毛）。',
'    float hwLocal = hw * sqrt(glintMask);',
'    float aaw = max(hwLocal, 0.35 * dpr);                     // 抗锯齿宽度给个下限，避免除零感',
'    float line = 1.0 - smoothstep(aaw - 0.40 * dpr, aaw + 0.40 * dpr, dLine);',
'',
'    // 【边缘层 · 2026-11-08 归位】宝把两件事说清了：',
'    //   边缘 = "通过颜色的变化勾勒出厚度和形状"（一段**从边界往里渐淡的带**，不是一条线）',
'    //   高光 = "勾出一种玻璃的清透感"（那条细亮线）',
'    //   ⚠️ 之前往这层塞了一条"贴边细勾"，等于用画线代替厚度 —— 已删。',
'    //   这里只留渐变带：edge 从边界=1 一路收到 0，靠它做"厚"和"形状"。',
'    //   line 留 0.08 只是让高光根部跟厚度带有一点呼应，不是描边。',
'    // ⚠️ 变量名不能叫 inner —— 上面折射段已有一个 vec2 inner，重名直接编译失败（2026-11-08 黑屏真凶）',
'    float innerWhite = edge * 0.55 + line * 0.08;',
'    g += vec3(innerWhite * uEdge * 0.85);',
'',
'    // 高光线颜色：几乎纯白（只留 8% 底色，不至于死板），亮度给足',
'    vec3 glintCol = mix(g, vec3(1.0), 0.92);',
'    // 亮度也 × mask：宽度和亮度两条一起归零，所以 mask=0 的地方是**真没有**，不是淡到看不见。',
'    g = mix(g, glintCol, clamp(line * glintMask * uSpec * 1.7, 0.0, 1.0));',
'',
'    col = mix(col, g, smoothstep(0.9, -0.6, sd));',
'  }',
'',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

function mkShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s) || '(empty log)';
    console.error('shader:', log);
    // 【2026-11-08】宝那边只能看到黑屏、看不到 console，所以把编译错误直接铺在页面上，
    // 一截图就能定位。修好后这层不会出现（只在编译失败时才长出来）。
    const box = document.createElement('pre');
    box.style.cssText = 'position:fixed;inset:0;z-index:99999;margin:0;padding:14px;'
      + 'background:#fff;color:#c00;font:11px/1.45 monospace;white-space:pre-wrap;overflow:auto';
    box.textContent = 'SHADER COMPILE ERROR\n\n' + log;
    (document.body || document.documentElement).appendChild(box);
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('link:', gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

const U = {
  res:     gl.getUniformLocation(prog, 'uRes'),
  rect:    gl.getUniformLocation(prog, 'uRect'),
  radius:  gl.getUniformLocation(prog, 'uRadius'),
  refract: gl.getUniformLocation(prog, 'uRefract'),
  blur:    gl.getUniformLocation(prog, 'uBlur'),
  edge:    gl.getUniformLocation(prog, 'uEdge'),
  spec:    gl.getUniformLocation(prog, 'uSpec'),
  zoom:    gl.getUniformLocation(prog, 'uZoom'),
  thick:   gl.getUniformLocation(prog, 'uThick'),
  tex:     gl.getUniformLocation(prog, 'uTex'),
};

const dock = document.getElementById('dock');
const r0 = document.getElementById('r0');
const r1 = document.getElementById('r1');
const r2 = document.getElementById('r2');
const r3 = document.getElementById('r3');
const r4 = document.getElementById('r4');
const r5 = document.getElementById('r5');

let rect = [0,0,100,56];
let dpr = 1;

function uploadTexture(){
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, off);
}

function draw(){
  gl.uniform2f(U.res, cvs.width, cvs.height);
  gl.uniform4f(U.rect, rect[0], rect[1], rect[2], rect[3]);
  gl.uniform1f(U.radius, 22 * dpr);
  gl.uniform1f(U.refract, parseFloat(r1.value));
  gl.uniform1f(U.blur, parseFloat(r2.value));
  gl.uniform1f(U.edge, parseFloat(r3.value));
  gl.uniform1f(U.spec, parseFloat(r4.value));
  gl.uniform1f(U.zoom, parseFloat(r5.value));
  gl.uniform1f(U.thick, parseFloat(r0.value));
  gl.uniform1i(U.tex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  document.getElementById('v0').textContent = parseFloat(r0.value).toFixed(2);
  document.getElementById('v1').textContent = parseFloat(r1.value).toFixed(2);
  document.getElementById('v2').textContent = Math.round(parseFloat(r2.value) * 1000);
  document.getElementById('v3').textContent = parseFloat(r3.value).toFixed(2);
  document.getElementById('v4').textContent = parseFloat(r4.value).toFixed(2);
  document.getElementById('v5').textContent = parseFloat(r5.value).toFixed(2);
}

let rafPending = false;
function redraw(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    rafPending = false;
    drawScene();
    uploadTexture();
    draw();
  });
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width  = Math.floor(innerWidth  * dpr);
  cvs.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cvs.width, cvs.height);

  W = Math.floor(innerWidth);
  H = Math.floor(innerHeight);
  off.width = W; off.height = H;

  const r = dock.getBoundingClientRect();
  rect = [r.left * dpr, r.top * dpr, r.width * dpr, r.height * dpr];

  drawScene();
  uploadTexture();
  draw();
}

/* 滚动 */
let startY = 0, startScroll = 0;
cvs.addEventListener('touchstart', function(e){
  startY = e.touches[0].clientY; startScroll = scrollY;
}, {passive:true});
cvs.addEventListener('touchmove', function(e){
  const y = e.touches[0].clientY;
  scrollY = startScroll + (startY - y);
  if (scrollY < 0) scrollY = 0;
  if (scrollY > maxScroll) scrollY = maxScroll;
  redraw();
  e.preventDefault();
}, {passive:false});

cvs.addEventListener('wheel', function(e){
  scrollY += e.deltaY;
  if (scrollY < 0) scrollY = 0;
  if (scrollY > maxScroll) scrollY = maxScroll;
  redraw();
  e.preventDefault();
}, {passive:false});

r0.oninput = r1.oninput = r2.oninput = r3.oninput = r4.oninput = r5.oninput = draw;
addEventListener('resize', resize);
addEventListener('orientationchange', function(){ setTimeout(resize, 180); });
setTimeout(resize, 60);

})();
</script>
</body>
</html>
