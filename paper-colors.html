<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸的颜色</title>
<style>
  body{margin:0;padding:18px 14px 40px;background:#2b2724;font-family:-apple-system,sans-serif}
  h1{font-size:15px;color:#c9c1b6;font-weight:500;margin:0 0 14px 4px;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .sw{flex:1;height:88px;border-radius:0;display:flex;align-items:center;justify-content:center;
      font-size:13px;letter-spacing:.5px;color:#3a342e;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
  .meta{width:120px;font-size:11px;color:#a89e92;line-height:1.5;text-align:right}
  .meta b{display:block;color:#e8e2d8;font-size:12px;font-weight:500;margin-bottom:2px}
  .tag{font-size:10px;color:#f0b95e}
</style></head><body>
<h1>纸的候选色（点开看，挑一个说编号就行）</h1>
<div class="row"><div class="sw" style="background:#F8F6F1">拍照　照片　视频　上传文件</div><div class="meta"><b>① #F8F6F1</b><span class="tag">现在这个</span></div></div>
<div class="row"><div class="sw" style="background:#FAF9F6">拍照　照片　视频　上传文件</div><div class="meta"><b>② #FAF9F6</b>更干净、黄气少</div></div>
<div class="row"><div class="sw" style="background:#FDFCFA">拍照　照片　视频　上传文件</div><div class="meta"><b>③ #FDFCFA</b>几乎纯白</div></div>
<div class="row"><div class="sw" style="background:#F6F4EF">拍照　照片　视频　上传文件</div><div class="meta"><b>④ #F6F4EF</b>中性一点</div></div>
<div class="row"><div class="sw" style="background:#F2F1EC">拍照　照片　视频　上传文件</div><div class="meta"><b>⑤ #F2F1EC</b>偏冷灰</div></div>
<div class="row"><div class="sw" style="background:#F5F3EE">拍照　照片　视频　上传文件</div><div class="meta"><b>⑥ #F5F3EE</b>更暖的米</div></div>
<div class="row"><div class="sw" style="background:#EFEDE6">拍照　照片　视频　上传文件</div><div class="meta"><b>⑦ #EFEDE6</b>旧纸、发黄</div></div>
<p style="color:#8d8478;font-size:11px;line-height:1.7;margin:18px 4px 0">
配色参考：机身 #2A2522（深褐黑）、LCD #1E2A22（暗绿）、分隔线 #D3CCBF。<br>
纸越白越"新纸"，越黄越"放久了的打印纸"。</p>
</body></html>
