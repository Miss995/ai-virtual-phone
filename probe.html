<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>probe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 13px/1.75 ui-monospace, Menlo, Consolas, monospace; background: #0b0b0f; color: #7CFC9A; padding: 12px 14px 40px; white-space: pre-wrap; word-break: break-all; }
  .k { color: #ffb36b; }
  .box { position: fixed; top: 0; left: 0; right: 0; height: 100vh; border: 3px dashed #ff3b3b; pointer-events: none; z-index: 99; }
  .box::after { content: '100vh 的底 ⇒'; position: absolute; left: 6px; bottom: 2px; font-size: 12px; color: #ff3b3b; background: rgba(0,0,0,.5); padding: 0 4px; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: #2196f3; z-index: 100; }
  #o { position: relative; z-index: 101; padding-top: 8px; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="box"></div>
<div id="o">loading…</div>
<div style="position:relative;z-index:101;margin-top:10px;font:12px sans-serif;color:#fff">
  <div style="height:100vh;background:rgba(255,60,60,.75);border:3px solid #ff3b3b;display:flex;align-items:center;justify-content:center;font:700 17px/1.3 sans-serif;text-align:center">
    <span>红块 = height:100vh</span>
  </div>
  <div style="height:100dvh;background:rgba(60,140,255,.75);border:3px solid #2196f3;display:flex;align-items:center;justify-content:center;font:700 17px/1.3 sans-serif;text-align:center">
    <span>蓝块 = height:100dvh</span>
  </div>
  <div style="height:704px;background:rgba(60,220,120,.75);border:3px solid #21c05a;display:flex;align-items:center;justify-content:center;font:700 17px/1.3 sans-serif;text-align:center">
    <span>绿块 = height:704px（写死的对照）</span>
  </div>
</div>
<script>
function line(k, v) { return '<span class="k">' + k + '</span> ' + v + '\n'; }
function measure(cssHeight) {
  var t = document.createElement('div');
  t.style.cssText = 'position:absolute;top:0;left:0;width:0;height:' + cssHeight + ';visibility:hidden';
  document.body.appendChild(t);
  var h = t.offsetHeight;
  t.remove();
  return h;
}
function probe() {
  var d = document.documentElement;
  var vv = window.visualViewport;
  var s = '';
  s += line('ua           ', navigator.userAgent);
  s += line('innerW x H   ', window.innerWidth + ' x ' + window.innerHeight);
  s += line('docClientW x H', d.clientWidth + ' x ' + d.clientHeight);
  s += line('screen       ', screen.width + 'x' + screen.height + '  avail ' + screen.availWidth + 'x' + screen.availHeight);
  s += line('dpr          ', window.devicePixelRatio);
  s += line('100vh   =>   ', measure('100vh') + 'px');
  s += line('100dvh  =>   ', measure('100dvh') + 'px');
  s += line('100%    =>   ', measure('100%') + 'px');
  s += line('window.outerH', window.outerHeight);
  if (vv) {
    s += line('vv.width x h ', Math.round(vv.width) + ' x ' + Math.round(vv.height));
    s += line('vv.scale     ', vv.scale);
    s += line('vv.pageTop   ', Math.round(vv.pageTop) + '  offsetTop ' + Math.round(vv.offsetTop));
  }
  s += line('body.scrollH ', document.body.scrollHeight);
  s += line('scrollY      ', window.scrollY);
  s += line('orientation  ', (screen.orientation && screen.orientation.type) || '-');
  s += '\n--- 时间线（每刻的窗口高度 / 100vh）---\n' + (window.__tl || []).join('\n');
  document.getElementById('o').innerHTML = s;
}

// 时间线：从脚本一执行就开始记（比 probe 更早）
window.__tl = [];
function mark(tag) {
  var vh = 0;
  try {
    var t = document.createElement('div');
    t.style.cssText = 'position:absolute;top:0;left:0;width:0;height:100vh;visibility:hidden';
    (document.body || document.documentElement).appendChild(t);
    vh = t.offsetHeight; t.remove();
  } catch (e) { vh = -1; }
  var ms = Math.round(performance.now());
  window.__tl.push(tag + '  @' + ms + 'ms  innerH=' + window.innerHeight + '  W=' + window.innerWidth + '  100vh=' + vh + 'px  readyState=' + document.readyState);
}
mark('script');
document.addEventListener('DOMContentLoaded', function () { mark('DOMContentLoaded'); });
window.addEventListener('load', function () { mark('load'); });
setTimeout(function () { mark('t+100'); probe(); }, 100);
setTimeout(function () { mark('t+400'); probe(); }, 400);
setTimeout(function () { mark('t+1500'); probe(); }, 1500);
setTimeout(function () { mark('t+3000'); probe(); }, 3000);

probe();
window.addEventListener('resize', function () { mark('resize'); probe(); });
window.addEventListener('orientationchange', function () { setTimeout(probe, 350); });
</script>
</body>
</html>
