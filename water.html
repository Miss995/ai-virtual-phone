<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1520">
<title>水面 · water</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#0a1520; overflow:hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #c { display:block; width:100vw; height:100vh; }

  #panel {
    position:fixed; left:12px; right:12px; bottom:12px;
    background: rgba(12,22,32,.72);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border:1px solid rgba(160,210,255,.16);
    border-radius:18px;
    color:#cfe4f5; font-size:12px;
    padding:10px 14px 12px;
    max-height:46vh; overflow-y:auto;
    transition: transform .25s ease, opacity .25s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #panel.hide { transform: translateY(120%); opacity:0; pointer-events:none; }

  .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .hd b { font-size:13px; letter-spacing:.06em; color:#e6f2ff; font-weight:600; }
  .hd span { opacity:.55; font-size:11px; }

  .row { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .row label { flex:0 0 62px; opacity:.72; font-size:11.5px; }
  .row input[type=range] { flex:1; -webkit-appearance:none; height:22px; background:transparent; }
  .row input[type=range]::-webkit-slider-runnable-track {
    height:3px; border-radius:2px;
    background: linear-gradient(90deg, rgba(120,190,255,.75), rgba(120,190,255,.18));
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:15px; height:15px; margin-top:-6px;
    border-radius:50%; background:#bfe1ff;
    box-shadow:0 0 10px rgba(140,200,255,.75), 0 1px 3px rgba(0,0,0,.5);
  }
  .row .val { flex:0 0 34px; text-align:right; font-variant-numeric: tabular-nums; opacity:.85; font-size:11px; }

  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button {
    flex:1 1 auto; min-width:70px;
    background: rgba(120,190,255,.10);
    border:1px solid rgba(140,200,255,.24);
    color:#cfe4f5; border-radius:11px; padding:8px 10px;
    font-size:11.5px; font-family:inherit; cursor:pointer;
  }
  button:active { background: rgba(120,190,255,.26); }
  button.on { background: rgba(120,190,255,.30); border-color: rgba(160,215,255,.55); color:#fff; }

  #tip {
    position:fixed; top:14px; left:0; right:0; text-align:center;
    color:rgba(200,225,245,.45); font-size:11px; letter-spacing:.14em;
    pointer-events:none; transition:opacity .5s;
  }
  #toggle {
    position:fixed; top:12px; right:12px; z-index:5;
    width:36px; height:36px; border-radius:50%;
    background: rgba(12,22,32,.6); border:1px solid rgba(160,210,255,.2);
    color:#cfe4f5; font-size:15px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">水 面</div>
<div id="toggle">≡</div>

<div id="panel">
  <div class="hd"><b>水面参数</b><span>拖滑杆看变化</span></div>

  <div class="row"><label>波纹强度</label><input id="s_amp"   type="range" min="0" max="100" value="42"><span class="val" id="v_amp">42</span></div>
  <div class="row"><label>波纹密度</label><input id="s_scale" type="range" min="10" max="100" value="38"><span class="val" id="v_scale">38</span></div>
  <div class="row"><label>流速</label>    <input id="s_speed" type="range" min="0" max="100" value="30"><span class="val" id="v_speed">30</span></div>
  <div class="row"><label>折射</label>    <input id="s_refr"  type="range" min="0" max="100" value="45"><span class="val" id="v_refr">45</span></div>
  <div class="row"><label>高光</label>    <input id="s_spec"  type="range" min="0" max="100" value="55"><span class="val" id="v_spec">55</span></div>
  <div class="row"><label>水色</label>    <input id="s_tint"  type="range" min="0" max="100" value="50"><span class="val" id="v_tint">50</span></div>

  <div class="btns">
    <button data-bg="grid" class="on">格子底</button>
    <button data-bg="dots">圆点底</button>
    <button data-bg="stripes">彩条底</button>
  </div>
  <div class="btns">
    <button id="b_caustics" class="on">水下光斑</button>
    <button id="b_pause">暂停</button>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uAmp;      // 波纹强度
uniform float uScale;    // 波纹密度
uniform float uSpeed;    // 流速
uniform float uRefr;     // 折射
uniform float uSpec;     // 高光
uniform float uTint;     // 水色浓淡
uniform float uBg;       // 0=格子 1=圆点 2=彩条
uniform float uCaustics; // 0/1

// ---------- 水下那层东西 ----------
vec3 underGrid(vec2 uv) {
    vec3 col = mix(vec3(0.055,0.105,0.150), vec3(0.135,0.215,0.285), uv.y);
    vec2 g = abs(fract(uv * vec2(9.0, 15.0)) - 0.5);
    float line = smoothstep(0.46, 0.50, max(g.x, g.y));
    col += line * vec3(0.30, 0.42, 0.52) * 0.55;
    float r = smoothstep(0.10, 0.0, length(uv - vec2(0.24, 0.68)));
    col += r * vec3(0.55, 0.66, 0.72) * 0.50;
    float r2 = smoothstep(0.16, 0.0, length(uv - vec2(0.78, 0.28)));
    col += r2 * vec3(0.42, 0.36, 0.30) * 0.55;
    return col;
}

vec3 underDots(vec2 uv) {
    vec3 col = mix(vec3(0.075,0.095,0.135), vec3(0.155,0.195,0.255), uv.y);
    vec2 cell = fract(uv * vec2(11.0, 17.0)) - 0.5;
    float d = smoothstep(0.20, 0.13, length(cell));
    float hue = fract(uv.x * 0.9 + uv.y * 0.55);
    vec3 dotc = mix(vec3(0.62,0.74,0.86), vec3(0.55,0.60,0.82), hue);
    col += d * dotc * 0.62;
    return col;
}

vec3 underStripes(vec2 uv) {
    float s = sin(uv.x * 14.0 + uv.y * 3.0);
    vec3 a = vec3(0.30,0.42,0.56);
    vec3 b = vec3(0.52,0.44,0.62);
    vec3 col = mix(a, b, s * 0.5 + 0.5) * mix(0.55, 1.0, uv.y);
    vec2 g = abs(fract(uv * vec2(6.0, 10.0)) - 0.5);
    float line = smoothstep(0.47, 0.50, max(g.x, g.y));
    col += line * vec3(0.75, 0.82, 0.92) * 0.35;
    return col;
}

vec3 under(vec2 uv) {
    if (uBg < 0.5)      return underGrid(uv);
    else if (uBg < 1.5) return underDots(uv);
    else                return underStripes(uv);
}

// ---------- 水面高度场 ----------
float wave(vec2 p, float t) {
    float h = 0.0;
    h += sin(p.x * 1.00 + t * 0.70) * 0.50;
    h += sin(p.y * 1.30 - t * 0.90) * 0.42;
    h += sin((p.x + p.y) * 0.75 + t * 1.25) * 0.32;
    h += sin((p.x - p.y * 1.70) * 2.10 + t * 1.85) * 0.16;
    h += sin((p.x * 2.60 + p.y * 1.10) + t * 2.60) * 0.09;
    h += sin(length(p) * 3.20 - t * 2.10) * 0.10;
    return h;
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 p = (gl_FragCoord.xy - uRes * 0.5) / min(uRes.x, uRes.y);
    p *= uScale;
    float t = uTime * uSpeed;

    // 有限差分求梯度
    float e = 0.012;
    float h0 = wave(p, t);
    float hx = wave(p + vec2(e, 0.0), t);
    float hy = wave(p + vec2(0.0, e), t);
    vec2 grad = vec2(hx - h0, hy - h0) / e;

    float amp = uAmp * 0.010;
    vec2 off = grad * amp * uRefr;

    // 三通道轻微色散
    vec2 offR = off * 1.06;
    vec2 offG = off;
    vec2 offB = off * 0.92;

    vec3 colR = under(uv + offR);
    vec3 colG = under(uv + offG);
    vec3 colB = under(uv + offB);
    vec3 col = vec3(colR.r, colG.g, colB.b);

    // 水色（越深越蓝）
    vec3 waterTint = vec3(0.12, 0.34, 0.46);
    float depthish = 0.30 + 0.22 * sin(uv.y * 3.0 + t * 0.4);
    col = mix(col, col * waterTint * 2.2, uTint * 0.42 * depthish);
    col += waterTint * uTint * 0.10;

    // 法线 + 高光
    vec3 n = normalize(vec3(-grad * amp * 6.0, 1.0));
    vec3 L = normalize(vec3(0.45, 0.75, 0.55));
    float spec = pow(max(dot(n, L), 0.0), 48.0);
    col += spec * uSpec * vec3(1.0, 1.0, 1.0) * 1.6;

    // 掠射角再补一道柔光（水面那种"亮一片"）
    float graze = pow(1.0 - max(n.z, 0.0), 3.0);
    col += graze * uSpec * vec3(0.55, 0.72, 0.88) * 1.1;

    // 水下焦散（波纹状光斑）
    if (uCaustics > 0.5) {
        float c1 = sin(grad.x * 9.0 + t * 1.4);
        float c2 = sin(grad.y * 9.0 - t * 1.1);
        float caustic = pow(abs(c1 * c2), 6.0);
        col += caustic * vec3(0.40, 0.68, 0.78) * 0.85;
    }

    // 暗角
    vec2 vg = uv - 0.5;
    float vig = smoothstep(0.85, 0.20, length(vg * vec2(1.0, 0.9)));
    col *= mix(0.55, 1.0, vig);

    // 轻微色调映射
    col = col / (col + vec3(0.85));
    col = pow(col, vec3(0.92));

    gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  const cvs = document.getElementById('c');
  const gl = cvs.getContext('webgl', { antialias:false, alpha:false, powerPreference:'high-performance' })
          || cvs.getContext('experimental-webgl');
  if (!gl) { document.body.innerHTML = '<div style="color:#cfe4f5;padding:40px;font-size:14px">这台设备不给 WebGL，看不成了。</div>'; return; }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uTime','uAmp','uScale','uSpeed','uRefr','uSpec','uTint','uBg','uCaustics']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));

  const S = { amp:42, scale:38, speed:30, refr:45, spec:55, tint:50, bg:0, caustics:1 };
  let paused = false, tAcc = 0, last = performance.now();

  function bind(id, key) {
    const el = document.getElementById('s_' + id);
    const out = document.getElementById('v_' + id);
    const upd = () => { S[key] = +el.value; out.textContent = el.value; };
    el.addEventListener('input', upd);
    upd();
  }
  bind('amp','amp'); bind('scale','scale'); bind('speed','speed');
  bind('refr','refr'); bind('spec','spec'); bind('tint','tint');

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      S.bg = { grid:0, dots:1, stripes:2 }[btn.dataset.bg];
    });
  });

  const bc = document.getElementById('b_caustics');
  bc.addEventListener('click', () => {
    S.caustics = S.caustics > 0.5 ? 0 : 1;
    bc.classList.toggle('on', S.caustics > 0.5);
  });

  const bp = document.getElementById('b_pause');
  bp.addEventListener('click', () => {
    paused = !paused;
    bp.textContent = paused ? '继续' : '暂停';
    bp.classList.toggle('on', paused);
  });

  const panel = document.getElementById('panel');
  document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('hide'));
  const tip = document.getElementById('tip');
  setTimeout(() => tip.style.opacity = '0', 2600);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) {
      cvs.width = w; cvs.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  addEventListener('resize', resize);
  resize();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) tAcc += dt;
    resize();
    gl.uniform2f(U.uRes, cvs.width, cvs.height);
    gl.uniform1f(U.uTime, tAcc);
    gl.uniform1f(U.uAmp, S.amp / 50);
    gl.uniform1f(U.uScale, 0.9 + S.scale / 28);
    gl.uniform1f(U.uSpeed, S.speed / 42);
    gl.uniform1f(U.uRefr, S.refr / 42);
    gl.uniform1f(U.uSpec, S.spec / 60);
    gl.uniform1f(U.uTint, S.tint / 55);
    gl.uniform1f(U.uBg, S.bg);
    gl.uniform1f(U.uCaustics, S.caustics);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
